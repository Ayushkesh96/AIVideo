# Brings up a GPU-backed ComfyUI reachable from the AIVideo deployment.
#
#   comfyui   — the actual model server. Not published to the host; only the
#               proxy can reach it, on the compose-internal network.
#   proxy     — Caddy, requiring the Authorization bearer token AIVideo sends
#               as COMFYUI_TOKEN. This is what the docs mean by "do not
#               expose ComfyUI directly" — ComfyUI itself has no auth.
#   cogvideox — a separate, optional model server (not ComfyUI-based — see
#               cogvideox-server/README.md for why). Behind a `profile` so
#               plain `docker compose up` doesn't start it: a single GPU
#               can't usefully run this and ComfyUI at once, and most people
#               only want one or the other. Start it explicitly with
#               `docker compose --profile cogvideox up cogvideox`.
#
# Usage: see docker/README.md.
services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aivideo-comfyui
    volumes:
      - ${MODELS_PATH:-./models}:/app/ComfyUI/models
      - ${OUTPUT_PATH:-./output}:/app/ComfyUI/output
      - ${INPUT_PATH:-./input}:/app/ComfyUI/input
      - ${USER_DATA_PATH:-./user}:/app/ComfyUI/user
    environment:
      # Extra git URLs to install on top of the VideoHelperSuite baked into
      # the image, comma-separated. Example for Wan/HunyuanVideo LoRA support:
      #   EXTRA_CUSTOM_NODES=https://github.com/kijai/ComfyUI-KJNodes
      #
      # Not a volume mount: custom_nodes/ ships VideoHelperSuite pre-installed
      # in the image, and a bind mount there would hide it. entrypoint.sh
      # re-clones (or fast-forward pulls) this list into the container's own
      # filesystem on every start instead — a few seconds of git clone, not a
      # real cost, and it can't shadow what the image already has.
      - EXTRA_CUSTOM_NODES=${EXTRA_CUSTOM_NODES:-}
      - COMFYUI_EXTRA_ARGS=${COMFYUI_EXTRA_ARGS:-}
      # Helps with VRAM fragmentation on long sessions.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    container_name: aivideo-comfyui-proxy
    depends_on:
      - comfyui
    ports:
      - "${LISTEN_PORT:-8188}:${LISTEN_PORT:-8188}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      - COMFYUI_TOKEN=${COMFYUI_TOKEN:?set COMFYUI_TOKEN in docker/.env — see docker/.env.example}
      - LISTEN_PORT=${LISTEN_PORT:-8188}
    restart: unless-stopped

  cogvideox:
    profiles: ["cogvideox"]
    build:
      context: ./cogvideox-server
      dockerfile: Dockerfile
    container_name: aivideo-cogvideox
    ports:
      - "${COGVIDEOX_PORT:-8189}:8189"
    volumes:
      - ${COGVIDEOX_HF_CACHE_PATH:-./cogvideox-hf-cache}:/app/hf-cache
      - ${COGVIDEOX_OUTPUT_PATH:-./cogvideox-output}:/app/output
    environment:
      # THUDM/CogVideoX-2b (the default) is the one documented to fit under
      # 10GB VRAM with CPU offload — see docker/cogvideox-server/README.md.
      # THUDM/CogVideoX-5b is noticeably better and needs more.
      - COGVIDEOX_MODEL=${COGVIDEOX_MODEL:-THUDM/CogVideoX-2b}
      - COGVIDEOX_FULL_GPU=${COGVIDEOX_FULL_GPU:-}
      # Own bearer-token auth built in (see server.py) — no reverse proxy
      # needed the way ComfyUI's setup above requires one. Deliberately NOT
      # a required (":?") variable: this service is profile-gated, but
      # Compose interpolates every service's environment block regardless of
      # which profile is active, so making it required here would break
      # plain `docker compose up` for people who only want ComfyUI and never
      # set COGVIDEOX_TOKEN at all. server.py itself refuses to start
      # without a token instead — see its own check.
      - COGVIDEOX_TOKEN=${COGVIDEOX_TOKEN:-}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
